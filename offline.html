<!DOCTYPE html>
<html lang="en">
<head>

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            background: #000;
            color: #4ade80;

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #5a7a5a;
